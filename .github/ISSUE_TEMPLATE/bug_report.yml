name: Bug report
description: Something in turnq is broken or behaves unexpectedly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues: do not file here.** See SECURITY.md.
        Message ids, timelines and `turnq explain` output make bugs much faster to fix.
  - type: input
    id: version
    attributes:
      label: turnq version
      description: Output of `turnq version`
      placeholder: v0.1.0 (commit abc1234)
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Server (binary)
        - Server (Docker / Helm)
        - Embedded (Go, file://)
        - Local sidecar (Node/Python, local:)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Delivery / leases / acks
        - Retries / DLQ
        - Delays / cron
        - Fairness / tenants / limits
        - Push delivery
        - Storage / recovery
        - Dashboard
        - API / CLI
        - SDK
        - Other
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected vs what you saw.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal config + commands/code. A failing conformance scenario is ideal.
      render: shell
    validations:
      required: true
  - type: textarea
    id: timeline
    attributes:
      label: Message timeline / explain output (if relevant)
      description: "`turnq get <id> --timeline` and `turnq explain <id>`. Redact payloads."
      render: json
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, arch, filesystem, fsync policy, approximate load.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
